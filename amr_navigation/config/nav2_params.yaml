      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15  # TĂNG: 0.10 → 0.15 (ít false stuck)
      movement_time_allowance: 45.0    # TĂNG: 30 → 45 (thêm thời gian)

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15     #dont change
      yaw_goal_tolerance: 0.15    #dont change

    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 56         # TĂNG: 40 → 56 (tầm nhìn xa hơn)
      model_dt: 0.1
      batch_size: 3000       # PRECISION: more samples
      max_angel_to_allow_movement: 0.3  # MỚI: rad ~17° - khi Δθ > 17° thì ép v_x=0

      vx_std: 0.08          # PRECISION: less noise
      vy_std: 0.15
      wz_std: 0.25          # PRECISION: less angular noise

      vx_max: 0.15          # PRECISION: SLOWER = more accurate
      vx_min: 0.0           # TẮT BACKWARD: -0.15 → 0.0 (không đi lùi)

      vy_max: 0.0
      vy_min: 0.0

      wz_max: 1.0           # PRECISION: slower turning
      wz_min: -1.0

      iteration_count: 1
      prune_distance: 1.0
      transform_tolerance: 0.2
      temperature: 0.2        # PRECISION: less exploration
      gamma: 0.015
      motion_model: "DiffDrive"
      checkpoint_trails: 10
      visualize_trajectory: true

      critics: ["ConstraintCritic", "CostCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0           # TĂNG: 2.5 → 5.0 (more costmap aware)
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.4
  
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0         # TĂNG: 8.0 → 10.0 (mạnh hơn - xoay theo path)
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 15
        use_path_orientations: true

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        offset_from_furthest: 2
        threshold_to_consider: 0.6

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0         # TĂNG: 2.0 → 8.0 (phạt nặng đi chéo)
        max_path_occupancy_ratio: 0.03
        trajectory_point_step: 2  # GIẢM: 4 → 2 (xem xét nhiều điểm hơn)
        offset_from_furthest: 2  # GIẢM: 4 → 2 (xem xét gần hơn)
        threshold_to_consider: 0.4  # GIẢM: 0.5 → 0.4 (effect sớm hơn)
        max_angle_to_furthest: 1.57
        forward_preference: true  # ĐỔI: false → true (chỉ đi forward)

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 7.0        # GIẢM: 10.0 → 7.0 (cho phép backward ngắn, tránh paralysis)
        threshold_to_consider: 0.5

      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 3.0  # GIẢM: 5.0 → 3.0 (cho phép spin để align)

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0        # PRECISION: prioritize reaching goal
        threshold_to_consider: 0.6
        near_goal_distance: 0.3  # PRECISION: goal behavior earlier

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.5        # GIẢM: 4.0 → 1.5 (giảm phạt khi xoay, tránh đi chéo)
        threshold_to_consider: 0.5  # GIẢM: 1.2 → 0.5 (chỉ effect khi rất gần goal)

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 3.0       # TĂNG: 1.5 → 3.0 (stronger avoidance)
        critical_weight: 30.0        # TĂNG: 20 → 30 (penalize collision harder)
        consider_footprint: true
        collision_cost: 100000.0     # TĂNG: 10000 → 100000 (very expensive collision)
        collision_margin_distance: 0.15  # TĂNG: 0.1 → 0.15 (bigger safe zone)
        near_goal_distance: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0 
      publish_frequency: 2.0 
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: true
      transform_tolerance: 1.0
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Footprint 4 góc dạng Polygon bao trọn 0.66m x 0.48m
      footprint: "[[0.48, 0.24], [0.48, -0.24], [-0.18, -0.24], [-0.18, 0.24]]"
      always_send_full_costmap: True
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan pointcloud
        scan:
          topic: /scan
          max_obstacle_height: 1.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 11.5
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.15
        pointcloud:
          topic: /points
          max_obstacle_height: 1.2
          min_obstacle_height: 0.1
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.4
          obstacle_max_range: 4.5
          obstacle_min_range: 0.4
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0    # TĂNG: 5.0 → 6.0
        inflation_radius: 1.0       # TĂNG: 0.7 → 1.0

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 1.0
      resolution: 0.05
      track_unknown_space: true
      # Footprint 4 góc dạng Polygon bao trọn 0.66m x 0.48m
      footprint: "[[0.48, 0.24], [0.48, -0.24], [-0.18, -0.24], [-0.18, 0.24]]"
      always_send_full_costmap: True
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        map_topic: /map

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan pointcloud
        scan:
          topic: /scan
          max_obstacle_height: 1.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 11.5
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.15
        pointcloud:
          topic: /points
          max_obstacle_height: 1.2
          min_obstacle_height: 0.1
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.4
          obstacle_max_range: 4.5
          obstacle_min_range: 0.4

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 1.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      # Cost-aware grid A* matches the holonomic mecanum base. Hybrid-A* and
      # state-lattice planners add non-holonomic turning constraints that this
      # robot does not have.
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.15
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 0.5
      cost_travel_multiplier: 2.0
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True
      refinement_num: 2
      w_data: 0.2
      w_smooth: 0.3

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "CLOSED_LOOP"
    max_velocity: [0.15, 0.0, 1.0]    # PRECISION: match controller limits
    min_velocity: [0.0, -0.0, -1.0]   # KHÔNG BACKWARD: match vx_min: 0.0
    max_accel: [0.3, 0.0, 1.5]          # PRECISION: slower acceleration
    max_decel: [-0.3, -0.0, -1.5]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.35