# [AUDIT_FIX]: Changed root from ekf_node: to /**: to match robot_localization expected format
/**:
  ros__parameters:
    use_sim_time: false

    # Frequency & Timeouts
    frequency: 50.0
    sensor_timeout: 0.1

    two_d_mode: true # Robot di chuyển trên mặt phẳng 2D
    publish_tf: true
    print_diagnostics: true
    debug: false

    # Frame IDs
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # ----------------------------------------------------
    # SENSOR INPUT 1: Wheel Odometry (ESP32 Encoders)
    # ----------------------------------------------------
    odom0: /odom_raw
    odom0_config: [false, false, false,    # x, y, z position
                   false, false, false,    # roll, pitch, yaw orientation
                   true,  false, false,    # vx, vy, vz (Chỉ lấy vận tốc tuyến tính X)
                   false, false, false,    # vroll, vpitch, vyaw (Nhường đo quay cho IMU)
                   false, false, false]    # ax, ay, az acceleration
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # ----------------------------------------------------
    # SENSOR INPUT 2: IMU Gyroscope (ESP32 / BNO055)
    # ----------------------------------------------------
    imu0: /imu/data_raw
    imu0_config: [false, false, false,    # x, y, z position
                  false, false, false,    # roll, pitch, yaw (ĐÃ SỬA: Tắt Yaw vì Python không pub Quaternion)
                  false, false, false,    # vx, vy, vz
                  false, false, true,     # vroll, vpitch, vyaw (Lấy vận tốc góc Z từ Gyroscope)
                  false, false, false]    # ax, ay, az acceleration
    imu0_differential: false
    imu0_relative: false                  # ĐÃ SỬA: Đặt false do không dùng Orientation
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: false

