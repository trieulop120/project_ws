# Pallet Detector Configuration
# Path: amr_perception/config/pallet_detector.yaml

/**:
  ros__parameters:
    # Model configuration
    model_path: ""  # Empty = auto-detect weights/best.pt

    # Detection thresholds
    conf_threshold: 0.5
    iou_threshold: 0.45

    # TF configuration
    target_frame: "map"
    pallet_frame_id: "pallet_frame"
    tf_timeout: 1.0

    # Debug
    debug_image: true
