# Depth Camera to LaserScan Conversion Parameters
# Converts RGB-D depth image to 2D LaserScan for SLAM/Nav2

/**:
  ros__parameters:
    # === Depth to LaserScan Node ===
    depth_to_laserscan_node:
      # Camera frame - adjust based on your URDF
      output_frame_id: camera_link

      # Scan height: number of pixel rows to average from center of depth image
      # Higher = more tolerant of vertical surfaces, but may include noise
      scan_height: 10

      # Time between scans (seconds)
      scan_time: 0.1

      # Range thresholds (meters) - Astra Pro typical range
      range_min: 0.4          # Min reliable depth (~40cm)
      range_max: 5.0         # Max reliable depth (~5m)

      # Depth image queue size
      queue_size: 5

    # === Fused Scan Merger Node ===
    # Merges LiDAR /scan and depth camera /scan_depth into single /scan_fused
    scan_fusion_node:
      # Topic names for input scans
      scan_topic_lidar: /scan
      scan_topic_depth: /scan_depth

      # Output fused scan topic
      output_scan_topic: /scan_fused

      # Scan queue size
      queue_size: 10

      # Transform timeout (seconds)
      tf_timeout: 0.1

      # Whether to use depth camera scan
      use_depth_scan: true

      # Angular resolution of depth scan (degrees)
      # Astra Pro horizontal FOV ~58°
      depth_scan_angle_min: -29.0  # -29 degrees
      depth_scan_angle_max: 29.0   # +29 degrees
